<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EAEAE8;
  --surface:#FFFFFF;
  --ink:#141414;
  --ink2:#5E5E5C;
  --ink3:#8B8B88;
  --rule:#D5D5D2;
  --rule2:#C2C2BE;
  --acid:#E4FF00;
  --acid-ink:#141414;
  --radius:14px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121211; --surface:#1B1B19; --ink:#F0F0ED; --ink2:#A8A8A2; --ink3:#7B7B74;
  --rule:#2C2C28; --rule2:#3C3C36; --acid:#D9F400; --acid-ink:#121211;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Archivo","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.7;letter-spacing:-.011em;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.u{
  font-family:"Archivo",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
}

/* ---------- announcement ---------- */
.ann{background:var(--acid);color:var(--acid-ink);text-align:center;padding:9px 20px}
.ann span{font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.ann b{text-decoration:underline;text-underline-offset:3px;font-weight:800}

/* ---------- header ---------- */
.hdr{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:20px clamp(20px,4vw,48px);
}
.mark{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:105%;
  font-size:19px;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
.mark sup{font-size:.5em;vertical-align:super;font-weight:700}
.hnav{display:flex;gap:22px;flex-wrap:wrap;margin-left:12px}
.hnav a{
  text-decoration:none;font-size:15.5px;font-weight:500;color:var(--ink2);
  letter-spacing:-.015em;white-space:nowrap;
}
.hnav a:hover{color:var(--ink)}
.hnav a[aria-current]{color:var(--ink);font-weight:700}
.cta{
  margin-left:auto;display:inline-block;text-decoration:none;
  background:var(--acid);color:var(--acid-ink);
  border-radius:999px;padding:11px 22px;font-size:13.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
}
.cta:hover{filter:brightness(.94)}

/* ---------- hero ---------- */
.hero{text-align:center;padding:clamp(40px,7vw,86px) clamp(20px,5vw,48px) clamp(34px,5vw,60px)}
.badge{
  display:inline-block;background:var(--ink);color:var(--bg);
  border-radius:999px;padding:7px 16px;font-size:11.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:clamp(24px,4vw,40px);
}
.hero h1{
  font-family:"Archivo","Noto Sans KR",sans-serif;
  font-weight:800;font-stretch:100%;
  font-size:clamp(42px,9vw,104px);line-height:.94;letter-spacing:-.045em;
  margin:0;text-wrap:balance;
}
.hero .sub{
  font-family:"Archivo","Noto Sans KR",sans-serif;font-weight:700;
  font-size:clamp(20px,3.4vw,38px);line-height:1.15;letter-spacing:-.03em;
  margin-top:clamp(14px,2vw,22px);color:var(--ink);text-wrap:balance;
}
.hero .intro{
  max-width:46ch;margin:clamp(30px,5vw,58px) auto 0;
  font-size:clamp(16px,1.9vw,18.5px);line-height:1.62;color:var(--ink2);
}

/* ---------- body ---------- */
.body{padding:0 clamp(20px,5vw,48px) 110px}
.col{max-width:780px;margin:0 auto}

.toc{
  background:var(--surface);border-radius:var(--radius);
  padding:26px 28px;margin-bottom:clamp(40px,6vw,64px);
}
.toc .u{font-size:11.5px;color:var(--ink3);display:block;margin-bottom:14px}
.toc ol{margin:0;padding:0;list-style:none;columns:2;column-gap:32px}
@media(max-width:640px){.toc ol{columns:1}}
.toc li{break-inside:avoid;margin-bottom:7px}
.toc a{text-decoration:none;font-size:14.5px;color:var(--ink2);line-height:1.45;display:block}
.toc a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

h2,h3,h4{font-family:"Archivo","Noto Sans KR",sans-serif;letter-spacing:-.032em;text-wrap:balance}
h2{font-size:clamp(28px,4.4vw,44px);font-weight:800;line-height:1.04;margin:clamp(56px,8vw,92px) 0 20px}
h3{font-size:clamp(21px,2.7vw,28px);font-weight:700;line-height:1.14;margin:48px 0 14px}
h4{font-size:17.5px;font-weight:700;margin:32px 0 10px;letter-spacing:-.022em}
p{margin:0 0 16px;max-width:66ch}
ul,ol{margin:0 0 18px;padding-left:22px;max-width:66ch}
li{margin-bottom:8px}
li::marker{color:var(--ink3)}
strong{font-weight:700}
hr{border:0;border-top:1px solid var(--rule2);margin:56px 0}

blockquote{
  background:var(--surface);border-radius:var(--radius);
  margin:26px 0;padding:24px 28px;color:var(--ink2);font-size:15.5px;max-width:none;
}
blockquote p{margin-bottom:10px;max-width:60ch}
blockquote p:last-child{margin-bottom:0}
blockquote strong{color:var(--ink)}

code{
  font-family:"Archivo",monospace;font-weight:600;font-size:.9em;
  background:var(--surface);border-radius:6px;padding:2px 7px;white-space:nowrap;
}

/* tables as cards */
.scroll{
  background:var(--surface);border-radius:var(--radius);
  padding:6px 24px 10px;margin:22px 0 30px;overflow-x:auto;
}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;line-height:1.55;
  font-variant-numeric:tabular-nums}
thead th{
  text-align:left;font-family:"Archivo",sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  padding:18px 18px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom;
}
tbody td{padding:15px 18px 15px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th:last-child,td:last-child{padding-right:0}
.scroll th:first-child,.scroll td:first-child{min-width:132px}

/* pending tag */
.todo{
  display:inline-block;background:var(--acid);color:var(--acid-ink);
  border-radius:999px;padding:2px 10px;font-size:11.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;vertical-align:1px;
}

/* ---------- footer ---------- */
.ft{border-top:1px solid var(--rule2);padding:38px clamp(20px,5vw,48px) 56px}
.ft-in{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:baseline}
.ft .u{font-size:11.5px;color:var(--ink3)}
.ft .next{margin-left:auto;text-decoration:none;font-size:15px;font-weight:800;letter-spacing:-.015em}
.ft .next:hover{text-decoration:underline;text-underline-offset:4px}

@media print{
  .ann,.hdr,.cta,.toc,.ft{display:none}
  body{background:#fff}
  .scroll,blockquote{background:#fff;border:1px solid #ddd}
}
</style>
</head>
<body>

<div class="ann"><span>{{ANN}} → <b>{{ANN_B}}</b></span></div>

<header class="hdr">
  <div class="mark">AURELLE<sup>™</sup></div>
  <nav class="hnav">{{NAV}}</nav>
  <a class="cta" href="{{NEXT_HREF}}">{{NEXT_LABEL}}</a>
</header>

<section class="hero">
  <span class="badge">{{BADGE}}</span>
  <h1>{{H1}}</h1>
  <div class="sub">{{SUB}}</div>
  <p class="intro">{{INTRO}}</p>
</section>

<main class="body">
  <div class="col">
    <nav class="toc"><span class="u">목차</span><ol>{{TOC}}</ol></nav>
    {{BODY}}
  </div>
</main>

<footer class="ft">
  <div class="ft-in">
    <span class="u">AURELLE™ · Trendier AI</span>
    <span class="u">{{TODO_NOTE}}</span>
    <a class="next" href="{{NEXT_HREF}}">{{NEXT_LABEL}} ›</a>
  </div>
</footer>

</body>
</html>
