<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#E9E3D8;
  --surface:#F6F2EA;
  --surface2:#FFFDF8;
  --ink:#231D16;
  --ink2:#6B5F51;
  --ink3:#9A8E7E;
  --rule:#DAD1C2;
  --rule2:#C8BDAA;
  --accent:{{ACCENT}};
  --accent-ink:#FFFDF8;
  --radius:14px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17140F; --surface:#211D17; --surface2:#2A251E;
  --ink:#F2ECE1; --ink2:#B3A796; --ink3:#857B6C;
  --rule:#332D25; --rule2:#453D32;
  --accent:{{ACCENT_D}}; --accent-ink:#17140F;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Archivo","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.72;letter-spacing:-.011em;word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.u{font-family:"Archivo",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.ann{background:var(--accent);color:var(--accent-ink);text-align:center;padding:9px 20px}
.ann span{font-size:13.5px;font-weight:700;letter-spacing:-.005em}
.ann b{text-decoration:underline;text-underline-offset:3px;font-weight:800}

.hdr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px clamp(20px,4vw,48px)}
.mark{font-family:"Archivo",sans-serif;font-weight:900;font-stretch:105%;
  font-size:19px;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
.mark sup{font-size:.5em;vertical-align:super;font-weight:700}
.hnav{display:flex;gap:20px;flex-wrap:wrap;margin-left:12px}
.hnav a{text-decoration:none;font-size:15px;font-weight:500;color:var(--ink2);
  letter-spacing:-.015em;white-space:nowrap}
.hnav a:hover{color:var(--ink)}
.hnav a[aria-current]{color:var(--ink);font-weight:700}
.cta{margin-left:auto;display:inline-block;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:11px 22px;font-size:13.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}

.hero{text-align:center;padding:clamp(40px,7vw,86px) clamp(20px,5vw,48px) clamp(34px,5vw,60px)}
.badge{display:inline-block;background:var(--ink);color:var(--bg);
  border-radius:999px;padding:7px 16px;font-size:11.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:clamp(24px,4vw,40px)}
.hero h1{font-family:"Archivo","Noto Sans KR",sans-serif;font-weight:800;font-stretch:100%;
  font-size:clamp(38px,8vw,92px);line-height:.96;letter-spacing:-.045em;margin:0;text-wrap:balance}
.hero .sub{font-family:"Archivo","Noto Sans KR",sans-serif;font-weight:700;
  font-size:clamp(19px,3.2vw,34px);line-height:1.18;letter-spacing:-.03em;
  margin-top:clamp(14px,2vw,22px);color:var(--accent);text-wrap:balance}
.hero .intro{max-width:46ch;margin:clamp(28px,5vw,54px) auto 0;
  font-size:clamp(16px,1.9vw,18px);line-height:1.62;color:var(--ink2)}

.body{padding:0 clamp(20px,5vw,48px) 110px}
.col{max-width:780px;margin:0 auto}

.toc{background:var(--surface);border-radius:var(--radius);padding:26px 28px;margin-bottom:clamp(40px,6vw,64px)}
.toc .u{font-size:11.5px;color:var(--ink3);display:block;margin-bottom:14px}
.toc ol{margin:0;padding:0;list-style:none;columns:2;column-gap:32px}
@media(max-width:640px){.toc ol{columns:1}}
.toc li{break-inside:avoid;margin-bottom:7px}
.toc a{text-decoration:none;font-size:14.5px;color:var(--ink2);line-height:1.45;display:block}
.toc a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

h2,h3,h4{font-family:"Archivo","Noto Sans KR",sans-serif;letter-spacing:-.032em;text-wrap:balance}
h2{font-size:clamp(26px,4.2vw,40px);font-weight:800;line-height:1.06;margin:clamp(52px,8vw,86px) 0 20px}
h3{font-size:clamp(20px,2.6vw,27px);font-weight:700;line-height:1.16;margin:52px 0 14px;
   padding-top:20px;border-top:1px solid var(--rule2)}
h4{font-size:17px;font-weight:700;margin:30px 0 10px;letter-spacing:-.022em}
p{margin:0 0 16px;max-width:66ch}
ul,ol{margin:0 0 18px;padding-left:22px;max-width:66ch}
li{margin-bottom:8px}
li::marker{color:var(--ink3)}
strong{font-weight:700}
em{font-style:normal;color:var(--ink2);background:var(--surface);
   border-radius:8px;padding:3px 10px;display:inline-block;margin:2px 0}
hr{border:0;border-top:1px solid var(--rule2);margin:56px 0}

blockquote{background:var(--surface2);border-left:3px solid var(--accent);
  border-radius:0 var(--radius) var(--radius) 0;
  margin:26px 0;padding:22px 26px;color:var(--ink2);font-size:15.5px;max-width:none}
blockquote p{margin-bottom:10px;max-width:60ch}
blockquote p:last-child{margin-bottom:0}
blockquote strong{color:var(--ink)}

code{font-family:"Archivo",sans-serif;font-weight:700;font-size:.88em;
  background:var(--surface);color:var(--ink2);
  border-radius:999px;padding:3px 12px;white-space:nowrap;letter-spacing:-.01em}

.scroll{background:var(--surface);border-radius:var(--radius);
  padding:6px 24px 10px;margin:22px 0 30px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14.5px;line-height:1.55;
  font-variant-numeric:tabular-nums}
thead th{text-align:left;font-family:"Archivo",sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  padding:18px 18px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
tbody td{padding:15px 18px 15px 0;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th:last-child,td:last-child{padding-right:0}
.scroll th:first-child,.scroll td:first-child{min-width:120px}

/* ---------- checklist board ---------- */
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
  gap:14px;margin:22px 0 26px}
.chk{background:var(--surface);border-radius:var(--radius);padding:20px 22px}
.chk h5{margin:0 0 12px;font-family:"Archivo","Noto Sans KR",sans-serif;
  font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.chk ul{list-style:none;margin:0;padding:0}
.chk li{position:relative;padding-left:26px;margin-bottom:10px;font-size:14.5px;line-height:1.5}
.chk li:last-child{margin-bottom:0}
.chk li::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;
  border:1.5px solid var(--rule2);border-radius:4px}

.lede{background:var(--surface);border-radius:var(--radius);padding:22px 26px;margin:22px 0 30px}
.lede p{margin:0 0 9px;max-width:60ch;font-size:15.5px;line-height:1.62}
.lede p:first-child{font-size:17px;color:var(--ink)}
.lede p:last-child{margin-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;max-width:none}
.chips .lbl{font-family:"Archivo",sans-serif;font-size:11px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-right:4px}
.chips code{background:var(--surface);color:var(--ink2);
  border:1.5px solid var(--rule2);padding:4px 13px}
.chips.own code{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.todo{display:inline-block;background:var(--accent);color:var(--accent-ink);
  border-radius:999px;padding:2px 10px;font-size:11.5px;
  font-family:"Archivo",sans-serif;font-weight:800;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;vertical-align:1px}

.ft{border-top:1px solid var(--rule2);padding:38px clamp(20px,5vw,48px) 56px}
.ft-in{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:baseline}
.ft .u{font-size:11.5px;color:var(--ink3)}
.ft .next{margin-left:auto;text-decoration:none;font-size:15px;font-weight:800;letter-spacing:-.015em}
.ft .next:hover{text-decoration:underline;text-underline-offset:4px}

@media print{
  .ann,.hdr,.cta,.toc,.ft{display:none}
  body{background:#fff}
  .scroll,blockquote,.chk{background:#fff;border:1px solid #ddd}
  .check{display:block}
}
</style>
</head>
<body>

<div class="ann"><span>{{ANN}} → <b>{{ANN_B}}</b></span></div>

<header class="hdr">
  <div class="mark">ROOTLAB<sup>™</sup></div>
  <nav class="hnav">{{NAV}}</nav>
  <a class="cta" href="{{NEXT_HREF}}">{{NEXT_LABEL}}</a>
</header>

<section class="hero">
  <span class="badge">{{BADGE}}</span>
  <h1>{{H1}}</h1>
  <div class="sub">{{SUB}}</div>
  <p class="intro">{{INTRO}}</p>
</section>

<main class="body">
  <div class="col">
    <nav class="toc"><span class="u">목차</span><ol>{{TOC}}</ol></nav>
    {{BODY}}
  </div>
</main>

<footer class="ft">
  <div class="ft-in">
    <span class="u">ROOTLAB™ · SUNDAY 3-STEP</span>
    <span class="u">{{TODO_NOTE}}</span>
    <a class="next" href="{{NEXT_HREF}}">{{NEXT_LABEL}} ›</a>
  </div>
</footer>

</body>
</html>
